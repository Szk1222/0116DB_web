<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="标贝科技个人信息保护政策，说明个人信息的收集、使用、存储、保护及用户权利。" />
<title>个人信息保护政策 · 标贝科技</title>
<link rel="stylesheet" href="_shared.css" />
<style>
/* =========================================================
   PRIVACY POLICY · Editorial legal document
   ========================================================= */
.policy-page {
  min-height: 100vh;
  padding: 0 20px 80px;
}
.policy-head {
  max-width: 920px;
  margin: 0 auto;
  padding: 64px 0 34px;
  text-align: center;
}
.policy-title {
  margin: 0;
  color: var(--text-hi);
  font-family: var(--font-cn);
  font-size: clamp(2rem, 4.6vw, 3.25rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -.02em;
}
.policy-lead {
  max-width: 680px;
  margin: 18px auto 0;
  color: var(--text-mute);
  font-size: .95rem;
  line-height: 1.85;
}
.policy-meta {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px 24px;
  flex-wrap: wrap;
  margin-top: 20px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .06em;
}
.policy-meta span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.policy-meta svg {
  width: 15px;
  height: 15px;
  color: var(--brand-hi);
}
.policy-shell {
  max-width: 920px;
  margin: 0 auto;
}
.policy-document {
  min-width: 0;
  padding: clamp(28px, 4.5vw, 58px);
  border: 1px solid var(--line);
  border-radius: 18px;
  background:
    linear-gradient(145deg, rgba(17,27,56,.82), rgba(8,15,34,.9)),
    rgba(8,15,34,.9);
  box-shadow: 0 30px 80px rgba(0,0,0,.22);
}
.policy-status {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 180px;
  color: var(--text-mute);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .08em;
}
.policy-status::before {
  content: "";
  width: 16px;
  height: 16px;
  border: 2px solid rgba(76,201,240,.2);
  border-top-color: var(--brand-hi);
  border-radius: 50%;
  animation: policy-spin .8s linear infinite;
}
@keyframes policy-spin { to { transform: rotate(360deg); } }
.policy-error {
  padding: 24px;
  border: 1px solid rgba(255,107,107,.3);
  border-radius: 10px;
  color: var(--text);
  background: rgba(255,107,107,.06);
  line-height: 1.75;
}
.policy-error a {
  color: var(--brand-hi);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.policy-article {
  color: #c4cee2;
  font-size: .96rem;
  line-height: 1.95;
  word-break: break-word;
}
.policy-article h1 {
  margin: 0 0 28px;
  color: var(--text-hi);
  font-family: var(--font-cn);
  font-size: 2rem;
}
.policy-article h2 {
  scroll-margin-top: 110px;
  margin: 58px 0 22px;
  padding: 0 0 14px 18px;
  border-bottom: 1px solid var(--line);
  color: var(--text-hi);
  font-family: var(--font-cn);
  font-size: clamp(1.25rem, 2.4vw, 1.58rem);
  line-height: 1.45;
}
.policy-article h2::before {
  content: "";
  position: absolute;
  width: 3px;
  height: 1.2em;
  margin: .13em 0 0 -18px;
  border-radius: 3px;
  background: var(--brand-hi);
  box-shadow: 0 0 14px rgba(76,201,240,.55);
}
.policy-article h2:first-child {
  margin-top: 0;
}
.policy-article h3 {
  scroll-margin-top: 110px;
  margin: 34px 0 14px;
  color: #e8efff;
  font-family: var(--font-cn);
  font-size: 1.06rem;
  line-height: 1.6;
}
.policy-article p {
  margin: 0 0 17px;
}
.policy-article strong {
  color: #eef5ff;
  font-weight: 600;
}
.policy-article ul {
  display: grid;
  gap: 8px;
  margin: 18px 0 28px;
  padding: 20px 24px 20px 44px;
  border: 1px solid rgba(76,201,240,.12);
  border-radius: 10px;
  background: rgba(76,201,240,.035);
}
.policy-article li::marker {
  color: var(--brand-hi);
}
.policy-article blockquote {
  margin: 22px 0;
  padding: 16px 20px;
  border-left: 3px solid var(--brand-hi);
  color: var(--text-mute);
  background: rgba(76,201,240,.05);
}
.policy-article hr {
  height: 1px;
  margin: 34px 0;
  border: 0;
  background: var(--line);
}
.policy-article code {
  padding: 2px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--brand-hi);
  background: rgba(0,0,0,.2);
  font-family: var(--font-mono);
  font-size: .86em;
}
.policy-article a {
  color: var(--brand-hi);
  text-decoration: underline;
  text-underline-offset: 3px;
}
@media (max-width: 600px) {
  .policy-page {
    padding: 0 12px 48px;
  }
  .policy-head {
    padding: 40px 8px 24px;
  }
  .policy-document {
    padding: 24px 20px;
    border-radius: 12px;
  }
  .policy-article {
    font-size: .92rem;
    line-height: 1.85;
  }
  .policy-article h2 {
    margin-top: 44px;
    padding-left: 14px;
  }
  .policy-article h2::before {
    margin-left: -14px;
  }
}
@media print {
  body {
    color: #222;
    background: #fff;
  }
  .policy-head {
    padding: 24px 0;
    border-bottom-color: #ddd;
  }
  .policy-title {
    color: #111;
  }
  .policy-shell {
    display: block;
    padding: 20px 0;
  }
  .policy-document {
    padding: 0;
    border: 0;
    box-shadow: none;
    background: none;
  }
  .policy-article,
  .policy-article h2,
  .policy-article h3,
  .policy-article strong {
    color: #222;
  }
  .policy-article h2 {
    break-after: avoid;
    border-bottom-color: #ddd;
  }
}
</style>
</head>
<body>
<main class="policy-page">
  <header class="policy-head">
      <h1 class="policy-title">个人信息保护政策</h1>
      <p class="policy-lead">我们重视并保护您的个人信息安全。本页面说明标贝科技在提供产品与服务过程中，对个人信息的收集、使用、存储和保护方式。</p>
      <div class="policy-meta" aria-label="政策信息">
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v16H4zM8 3v4M16 3v4M4 10h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
          更新时间：2022年9月29日
        </span>
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          发布主体：标贝科技有限公司
        </span>
      </div>
  </header>

  <div class="policy-shell">
    <section class="policy-document" aria-label="个人信息保护政策正文">
      <article class="policy-article" id="policyContent" aria-live="polite">
        <div class="policy-status">正在加载政策正文</div>
      </article>
    </section>
  </div>
</main>

<script>
(function () {
  const content = document.getElementById('policyContent');

  function escapeHtml(value) {
    return value
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function renderInline(value) {
    let html = escapeHtml(value);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return html;
  }

  function renderMarkdown(markdown) {
    const cleaned = markdown
      .replace(/\r\n?/g, '\n')
      .replace(/^(?:>.*\n)+\s*---\s*\n*/u, '')
      .replace(/^#\s+个人信息保护政策\s*$/mu, '');
    const lines = cleaned.split('\n');
    const html = [];
    let paragraph = [];
    let listOpen = false;
    let quoteOpen = false;

    function closeParagraph() {
      if (!paragraph.length) return;
      html.push('<p>' + renderInline(paragraph.join(' ')) + '</p>');
      paragraph = [];
    }
    function closeList() {
      if (!listOpen) return;
      html.push('</ul>');
      listOpen = false;
    }
    function closeQuote() {
      if (!quoteOpen) return;
      html.push('</blockquote>');
      quoteOpen = false;
    }
    function closeBlocks() {
      closeParagraph();
      closeList();
      closeQuote();
    }

    lines.forEach(function (rawLine) {
      const line = rawLine.trim();

      if (!line) {
        closeParagraph();
        closeQuote();
        return;
      }

      const heading = line.match(/^(#{1,3})\s+(.+)$/);
      if (heading) {
        closeBlocks();
        const level = heading[1].length;
        html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
        return;
      }

      if (/^---+$/.test(line)) {
        closeBlocks();
        html.push('<hr>');
        return;
      }

      const listItem = line.match(/^-\s+(.+)$/);
      if (listItem) {
        closeParagraph();
        closeQuote();
        if (!listOpen) {
          html.push('<ul>');
          listOpen = true;
        }
        html.push('<li>' + renderInline(listItem[1]) + '</li>');
        return;
      }

      const quote = line.match(/^>\s?(.*)$/);
      if (quote) {
        closeParagraph();
        closeList();
        if (!quoteOpen) {
          html.push('<blockquote>');
          quoteOpen = true;
        }
        html.push('<p>' + renderInline(quote[1]) + '</p>');
        return;
      }

      closeList();
      closeQuote();
      paragraph.push(line);
    });

    closeBlocks();
    return html.join('');
  }

  fetch('个人信息保护政策.md')
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.text();
    })
    .then(function (markdown) {
      content.innerHTML = renderMarkdown(markdown);
    })
    .catch(function () {
      content.innerHTML =
        '<div class="policy-error">' +
        '政策正文暂时无法加载。您可以直接查看 ' +
        '<a href="个人信息保护政策.md" target="_blank" rel="noopener">Markdown 原文</a>。' +
        '</div>';
    });
})();
</script>
</body>
</html>
